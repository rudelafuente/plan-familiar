<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar el plan</title><style>body{font:17px system-ui;background:#f4f2ec;color:#17313b;max-width:480px;margin:15vh auto;padding:24px}button{background:#17313b;color:white;border:0;border-radius:14px;padding:16px;font:inherit}p{line-height:1.6}</style><h1>Actualizar el plan</h1><p>Renueva los archivos de la aplicación. Conserva los datos guardados en este navegador.</p><button id="update">Actualizar y abrir</button><p id="status" role="status"></p><script>
document.getElementById('update').onclick=async()=>{const b=document.getElementById('update'),s=document.getElementById('status');b.disabled=true;s.textContent='Actualizando…';try{const base=new URL('./',location.href).href;for(const r of await navigator.serviceWorker.getRegistrations()){if(r.scope===base)await r.unregister();}for(const k of await caches.keys()){if(k.startsWith('plan-familiar-shell-'))await caches.delete(k);}location.replace('./?updated='+Date.now());}catch(e){s.textContent='No se pudo actualizar: '+e.message;b.disabled=false;}};
</script></html>
